name: Test

on:
  push:
  pull_request:

jobs:
  test:
    # GitHub's hosted macOS runner — ships Xcode + iOS Simulators
    # preinstalled. No physical Mac or iPhone needed; the Simulator is
    # sufficient for this package's whole test suite, including the
    # Keychain-backed tests.
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Show Xcode/Swift versions
        run: |
          xcodebuild -version
          swift --version

      - name: Run tests (Simulator — required, not optional)
        # Do NOT use bare `swift test` here. It builds/runs the test host
        # as a plain macOS command-line process, which has no Info.plist
        # (Bundle.main.bundleIdentifier is nil there — fails the bundle_id
        # registration test).
        #
        # Picks whichever iPhone Simulator the runner's Xcode actually has
        # (newest available) rather than hardcoding a model name that will
        # eventually stop existing as Xcode versions roll forward.
        #
        # Scheme must be "<PackageName>-Package", not the bare package/
        # product name — confirmed via `xcodebuild -list` against this
        # exact package: Xcode auto-generates one scheme per library
        # product (PushNotificationServiceSDK, PushNotificationServiceExtensionKit),
        # but those are build-only. Only the "-Package" umbrella scheme
        # has the Test action configured, and it's the one that runs
        # every test target (Core/SDK/ExtensionKit) in one invocation.
        #
        # CODE_SIGNING_ALLOWED=NO: a raw SPM package (no wrapping .xcodeproj/
        # .app target) has no entitlements file, so its auto-generated test
        # host isn't in any Keychain access group — SecItemAdd/SecItemUpdate
        # fail with errSecMissingEntitlement (-34018) even under a real
        # Simulator destination, contrary to what earlier documentation in
        # this repo's history assumed ("Simulator avoids the entitlement
        # gap, only bare swift test hits it" — that assumption was wrong,
        # discovered only once this actually ran in real CI for the first
        # time). Disabling code signing removes the signature Keychain would
        # otherwise check an access-group against, which lets an unsigned
        # Simulator process read/write its own default keychain.
        run: |
          DEVICE_NAME=$(xcrun simctl list devices available iOS \
            | grep -Eo 'iPhone [0-9]+( Pro( Max)?)?' \
            | sort -V | tail -1)
          echo "Using simulator: $DEVICE_NAME"
          xcodebuild test \
            -scheme PushNotificationServiceSDK-Package \
            -destination "platform=iOS Simulator,name=$DEVICE_NAME" \
            CODE_SIGNING_ALLOWED=NO
